{% extends 'base.html' %}
{% block title %}Edit{% endblock %}
{% block content %}

<form method="POST">
<input name="title" value="{{note[1]}}" class="form-control mb-2">
<textarea name="content" class="form-control mb-2">{{note[2]}}</textarea>
<input name="color" type="color" value="{{note[3]}}" class="form-control mb-2">
<button class="btn btn-warning">Save</button>
</form>

{% endblock %}
